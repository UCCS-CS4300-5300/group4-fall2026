# Pre-merge integration check (research intervention, Milestone 2).
# Runs the test suite and a migration check on every pull request into a
# shared branch. For pull requests GitHub tests the *merged* result
# (refs/pull/<n>/merge), so changes that only break when combined are caught.
name: tests

on:
  pull_request:
    branches: [main, "sprint-*", "research/ci-gate*"]
  push:
    branches: [main, "sprint-*", "research/ci-gate*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4

      - name: Show which code is being tested
        run: |
          echo "Event: ${{ github.event_name }}  Ref: ${{ github.ref }}"
          git log -1 --format='Commit under test: %H%nParents: %P%nSubject: %s'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (live AI tests excluded)
        run: python -m pytest -m "not live" -rfE --strict-markers --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: project/test-results.xml
          if-no-files-found: ignore
