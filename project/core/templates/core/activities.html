
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trip Activities</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#F7F7FB] p-6">

<main class="max-w-2xl mx-auto bg-white rounded-3xl p-8 shadow-sm">

    <h1 class="text-3xl font-bold">
        What would you like to do?
    </h1>

    <p class="text-slate-500 mt-3">
        Choose activities that interest you.
    </p>

    <p class="text-sm text-slate-500 mt-2">
        {{ trip_name }} · {{ person_name }}
    </p>

    {% if error %}
        <p class="text-red-600 mt-4">{{ error }}</p>
    {% endif %}

    <form method="POST" class="mt-8">
        {% csrf_token %}

        <div class="space-y-4">

            {% for activity in activities %}
                <label class="flex items-center gap-3 border rounded-xl p-4">
                    <input
                        type="checkbox"
                        name="activities"
                        value="{{ activity }}"
                    >
                    {{ activity }}
                </label>
            {% empty %}

                {% for activity in default_activities %}
                    <label class="flex items-center gap-3 border rounded-xl p-4">
                        <input
                            type="checkbox"
                            name="activities"
                            value="{{ activity }}"
                        >
                        {{ activity }}
                    </label>
                {% empty %}

                    <label class="flex items-center gap-3 border rounded-xl p-4">
                        <input type="checkbox" name="activities" value="Food and restaurants">
                        Food and restaurants
                    </label>

                    <label class="flex items-center gap-3 border rounded-xl p-4">
                        <input type="checkbox" name="activities" value="Museums and culture">
                        Museums and culture
                    </label>

                    <label class="flex items-center gap-3 border rounded-xl p-4">
                        <input type="checkbox" name="activities" value="Outdoor adventures">
                        Outdoor adventures
                    </label>

                    <label class="flex items-center gap-3 border rounded-xl p-4">
                        <input type="checkbox" name="activities" value="Shopping">
                        Shopping
                    </label>

                    <label class="flex items-center gap-3 border rounded-xl p-4">
                        <input type="checkbox" name="activities" value="Nightlife">
                        Nightlife
                    </label>

                    <label class="flex items-center gap-3 border rounded-xl p-4">
                        <input type="checkbox" name="activities" value="Nature and sightseeing">
                        Nature and sightseeing
                    </label>

                {% endfor %}
            {% endfor %}

        </div>

        <label class="block font-semibold mt-8 mb-2">
            Additional notes
        </label>

        <textarea
            name="additional_notes"
            rows="4"
            maxlength="5000"
            placeholder="Anything else you would like the group to know?"
            class="w-full border rounded-xl p-4"
        ></textarea>

        <button
            type="submit"
            class="w-full bg-[#635BFF] text-white rounded-xl p-4 mt-8 font-semibold"
        >
            Submit my preferences →
        </button>

    </form>

</main>

</body>
</html>
