
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trip Budget</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#F7F7FB] p-6">

<main class="max-w-2xl mx-auto bg-white rounded-3xl p-8 shadow-sm">

    <h1 class="text-3xl font-bold">
        What's your budget?
    </h1>

    <p class="text-slate-500 mt-3">
        Enter your individual budget for the trip.
    </p>

    <p class="text-sm text-slate-500 mt-2">
        {{ trip_name }} · {{ person_name }}
    </p>

    {% if error %}
        <p class="text-red-600 mt-4">{{ error }}</p>
    {% endif %}

    <form method="POST" class="mt-8">
        {% csrf_token %}

        <label class="block font-semibold mb-2">
            Budget amount
        </label>

        <input
            type="number"
            name="budget_amount"
            min="0.01"
            step="0.01"
            required
            placeholder="2500"
            class="w-full border rounded-xl p-4 mb-6"
        >

        <label class="block font-semibold mb-2">
            Currency
        </label>

        <select
            name="currency"
            class="w-full border rounded-xl p-4"
        >
            <option value="USD">USD - US Dollar</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - British Pound</option>
            <option value="CAD">CAD - Canadian Dollar</option>
            <option value="AUD">AUD - Australian Dollar</option>
            <option value="JPY">JPY - Japanese Yen</option>
        </select>

        <button
            type="submit"
            class="w-full bg-[#635BFF] text-white rounded-xl p-4 mt-8 font-semibold"
        >
            Continue →
        </button>

    </form>

</main>

</body>
</html>
