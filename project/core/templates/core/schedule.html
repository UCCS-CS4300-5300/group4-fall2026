
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#F7F7FB] p-6">

<main class="max-w-2xl mx-auto bg-white rounded-3xl p-8 shadow-sm">

    <h1 class="text-3xl font-bold">
        When are you available?
    </h1>

    <p class="text-slate-500 mt-3">
        Your availability will be compared with the other trip participants.
    </p>

    <p class="text-sm text-slate-500 mt-2">
        {{ trip_name }} · {{ person_name }}
    </p>

    {% if error %}
        <p class="text-red-600 mt-4">{{ error }}</p>
    {% endif %}

    <form method="POST" class="mt-8">
        {% csrf_token %}

        <label class="block font-semibold mb-2">
            Available from
        </label>

        <input
            type="date"
            name="start_date"
            required
            class="w-full border rounded-xl p-4 mb-5"
        >

        <label class="block font-semibold mb-2">
            Available until
        </label>

        <input
            type="date"
            name="end_date"
            required
            class="w-full border rounded-xl p-4 mb-6"
        >

        <label class="block font-semibold mb-2">
            Preferred travel pace
        </label>

        <select
            name="pace"
            class="w-full border rounded-xl p-4 mb-6"
        >
            <option value="relaxed">Relaxed</option>
            <option value="balanced" selected>Balanced</option>
            <option value="packed">Packed</option>
        </select>

        <div class="grid grid-cols-2 gap-4">

            <div>
                <label class="block font-semibold mb-2">
                    Start of day
                </label>

                <input
                    type="time"
                    name="day_start"
                    value="09:00"
                    required
                    class="w-full border rounded-xl p-4"
                >
            </div>

            <div>
                <label class="block font-semibold mb-2">
                    End of day
                </label>

                <input
                    type="time"
                    name="day_end"
                    value="21:00"
                    required
                    class="w-full border rounded-xl p-4"
                >
            </div>

        </div>

        <button
            type="submit"
            class="w-full bg-[#635BFF] text-white rounded-xl p-4 mt-8 font-semibold"
        >
            Continue →
        </button>

    </form>

</main>

</body>
</html>
