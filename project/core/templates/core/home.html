
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create a Trip</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#F7F7FB] flex items-center justify-center p-6">

<div class="bg-white rounded-3xl shadow-lg p-10 w-full max-w-lg">

    <h1 class="text-3xl font-bold mb-3">
        Plan a trip together
    </h1>

    <p class="text-slate-500 mb-8">
        Create a trip and invite your friends to contribute.
    </p>

    {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded-xl mb-5">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label class="block font-semibold mb-2">
            Trip name
        </label>

        <input
            type="text"
            name="tripName"
            maxlength="120"
            required
            placeholder="e.g. Summer in Europe"
            class="w-full border rounded-xl p-4 mb-5"
        >

        <label class="block font-semibold mb-2">
            Your name
        </label>

        <input
            type="text"
            name="personName"
            maxlength="50"
            required
            placeholder="Enter your name"
            class="w-full border rounded-xl p-4 mb-6"
        >

        <button
            type="submit"
            class="w-full bg-[#635BFF] text-white rounded-xl p-4 font-semibold"
        >
            Create trip
        </button>
    </form>

    <div class="border-t mt-8 pt-6 text-center">

        <p class="text-slate-500 mb-3">
            Already invited to a trip?
        </p>

        <a
            href="{% url 'core:join_trip' %}"
            class="text-[#635BFF] font-semibold hover:underline"
        >
            Join an existing trip →
        </a>

    </div>

</div>

</body>
</html>
